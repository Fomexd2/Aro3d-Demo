<html lang="es-MX">
<head>
<meta charset="UTF-8">

<title>aro3d · Demo</title>

<style>
:root{
  --amber:#FCB92C; --amber-d:#E0A111; --navy:#182132; --navy-2:#24304a; --teal:#5FA89B; --teal-l:#8FB4AC;
  --bg:#F5F7F9; --surface:#FFFFFF; --surface-2:#EEF2F5; --line:#E2E8ee;
  --txt:#1F2933; --txt-2:#5B6675; --txt-3:#8A93A0;
  --ok:#2E8B4F; --warn:#C8901A; --danger:#C0392B; --info:#2E6CB8;
  --bronce:#B07B4F; --plata:#8A93A0; --oro:#D4A017; --platino:#3FA9B5;
  --r:16px; --r-lg:22px; --r-sm:10px;
  --sh:0 2px 8px rgba(20,30,50,.07); --sh-2:0 8px 24px rgba(20,30,50,.12); --sh-3:0 16px 40px rgba(20,30,50,.18);
  --rail-w:248px; --t:200ms cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;font-size:16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
::selection{background:var(--amber);color:var(--navy)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.shell{display:flex;min-height:100dvh}
.rail{display:none;flex:0 0 var(--rail-w);background:var(--navy);color:#fff;flex-direction:column;position:sticky;top:0;height:100dvh;padding:18px 14px;gap:4px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:10px 12px 18px}
.rail .brand b{font-size:22px;font-weight:900;letter-spacing:.5px}
.rail .brand .dot,.auth .logo .dot,.appbar .ab-brand .dot{background:linear-gradient(135deg,var(--amber),var(--amber-d));display:grid;place-items:center;color:var(--navy);font-weight:900}
.rail .brand .dot{width:30px;height:30px;border-radius:9px}
.rail .navitem{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;color:#C3CCDb;font-weight:700;font-size:15px;transition:background var(--t),color var(--t);text-align:left;width:100%}
.rail .navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.rail .navitem.active{background:rgba(252,185,44,.16);color:var(--amber)}
.rail .navitem svg{width:22px;height:22px;flex:0 0 22px}
.rail .spacer{flex:1}
.rail .role-pill{margin:6px 12px;font-size:12px;color:#8290a8;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .title{font-weight:800;font-size:19px}
.appbar .ab-brand{display:none;align-items:center;gap:8px;font-weight:900;font-size:18px}
.appbar .ab-brand .dot{width:26px;height:26px;border-radius:8px;font-size:14px}
.appbar .grow{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--txt-2);transition:background var(--t),transform var(--t)}
.iconbtn:hover{background:var(--surface-2)} .iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px} .iconbtn.sm{width:36px;height:36px}.iconbtn.sm svg{width:18px;height:18px}
.content{flex:1;padding:18px 16px 100px;max-width:1120px;width:100%;margin:0 auto}
.page-h{font-size:24px;font-weight:900;margin:4px 0 14px}
.page-sub{color:var(--txt-2);margin:-8px 0 16px;font-size:14px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(20,30,50,.06)}
.bottomnav .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--txt-3);font-size:11px;font-weight:700;min-height:48px;transition:color var(--t)}
.bottomnav .navitem svg{width:24px;height:24px}
.bottomnav .navitem .pip{height:3px;width:0;border-radius:3px;background:var(--amber);transition:width var(--t)}
.bottomnav .navitem.active{color:var(--navy)} .bottomnav .navitem.active .pip{width:22px}
.bottomnav .navitem:active{transform:scale(.94)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:13px;font-weight:800;font-size:15px;transition:transform var(--t),box-shadow var(--t),background var(--t);min-width:44px}
.btn:active{transform:scale(.96)}
.btn.filled{background:var(--amber);color:var(--navy);box-shadow:0 4px 12px rgba(252,185,44,.35)} .btn.filled:hover{background:var(--amber-d)}
.btn.navy{background:var(--navy);color:#fff}.btn.navy:hover{background:var(--navy-2)}
.btn.tonal{background:var(--surface-2);color:var(--navy)}.btn.tonal:hover{background:#e3e9ee}
.btn.danger{background:var(--danger);color:#fff}.btn.danger:hover{filter:brightness(.92)}
.btn.text{height:42px;padding:0 12px;color:var(--info);background:none}.btn.text:hover{background:rgba(46,108,184,.08)}
.btn.block{display:flex;width:100%} .btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:11px}
.btn svg{width:19px;height:19px} .btn[disabled]{opacity:.4;pointer-events:none}
.fab{position:fixed;right:18px;bottom:84px;z-index:35;height:56px;padding:0 22px;border-radius:18px;background:var(--amber);color:var(--navy);font-weight:800;display:inline-flex;align-items:center;gap:9px;box-shadow:var(--sh-2);transition:transform var(--t),box-shadow var(--t)}
.fab:hover{box-shadow:var(--sh-3)} .fab:active{transform:scale(.95)} .fab svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:20px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--txt-2)}
.chip.ok{background:#e4f3ea;color:var(--ok)} .chip.info{background:#e4ecf7;color:var(--info)}
.chip.warn{background:#fbf0d8;color:var(--warn)} .chip.dang{background:#f8e4e2;color:var(--danger)} .chip.teal{background:#e3f0ed;color:#2f7d70}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:800;font-size:13.5px;color:var(--txt-2)} .field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--txt);transition:border-color var(--t),box-shadow var(--t)}
.field textarea{height:auto;padding:12px 14px;min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(252,185,44,.2)}
.field .hint{font-size:12px;color:var(--txt-3)} .field.err input,.field.err textarea{border-color:var(--danger)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--teal);flex:0 0 auto}
.row{display:flex;align-items:center;gap:12px} .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--txt-2)} .small{font-size:13px} .xsmall{font-size:11.5px}
.list-item{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--line)} .list-item:last-child{border-bottom:none}
.badge-tier{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-weight:900;font-size:12px;color:#fff}
.search{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px}
.search input{border:none;height:auto;flex:1;background:none;padding:0} .search input:focus{outline:none} .search svg{width:20px;height:20px;color:var(--txt-3)}
.doc-hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,#1f4a52 60%,var(--teal) 130%);box-shadow:var(--sh-2)}
.doc-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.doc-hero .pts{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px}
.ring-wrap{position:relative;width:96px;height:96px;flex:0 0 96px} .ring-wrap svg{transform:rotate(-90deg)} .ring-wrap .rc{fill:none;stroke-width:10;stroke-linecap:round}
.ring-wrap .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)} .kpi .v{font-size:24px;font-weight:900} .kpi .l{font-size:12px;color:var(--txt-2);font-weight:700}
.code-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);border-radius:14px;padding:12px 14px;margin-top:14px}
.code-card .code{font-size:21px;font-weight:900;letter-spacing:1px}
.timeline .ti{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .timeline .ti:last-child{border:none}
.timeline .tdot{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--teal);flex:0 0 34px} .timeline .tdot svg{width:18px;height:18px}
.plus-badge{font-weight:900;color:var(--ok)}
.icon-box{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--teal);flex:0 0 40px}
.cd{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--amber);color:var(--navy);border-radius:12px;padding:9px 13px;font-weight:800;font-size:13px} .cd svg{width:17px;height:17px;color:var(--amber-d)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:11px;font-weight:800;color:var(--txt-3);padding:4px 0}
.cal .day{aspect-ratio:1;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;position:relative;transition:background var(--t),transform var(--t)}
.cal .day:hover{background:#e3e9ee} .cal .day:active{transform:scale(.93)}
.cal .day.has{box-shadow:inset 0 0 0 1.5px var(--amber)} .cal .day.today{color:var(--amber-d)}
.cal .day.sel{background:var(--navy);color:#fff} .cal .day .n{position:absolute;bottom:6px;height:5px;width:5px;border-radius:50%;background:var(--amber)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:3px} .seg button{padding:7px 16px;border-radius:9px;font-weight:800;font-size:13px;color:var(--txt-2);transition:all var(--t)} .seg button.on{background:var(--surface);color:var(--navy);box-shadow:var(--sh)}
.seg.full{display:flex} .seg.full button{flex:1}
#snk{position:fixed;left:50%;bottom:96px;transform:translate(-50%,160%);opacity:0;pointer-events:none;z-index:90;background:var(--navy);color:#fff;padding:13px 18px;border-radius:13px;font-weight:700;font-size:14px;box-shadow:var(--sh-2);display:flex;align-items:center;gap:10px;max-width:90vw;transition:transform .35s cubic-bezier(.2,.9,.2,1),opacity .25s}
#snk.show{transform:translate(-50%,0);opacity:1} #snk svg{width:20px;height:20px;color:var(--amber)}
@media(min-width:1024px){#snk{bottom:26px}}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,20,32,.5);opacity:0;pointer-events:none;transition:opacity var(--t)} .scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto;transform:translateY(102%);visibility:hidden;opacity:0;transition:transform .38s cubic-bezier(.2,.9,.2,1),opacity .25s,visibility .38s;box-shadow:var(--sh-3)}
.sheet.show{transform:translateY(0);visibility:visible;opacity:1} .sheet .handle{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px} .sheet h3{margin:0 0 14px;font-size:20px;font-weight:900}
@media(min-width:760px){.sheet{left:50%;right:auto;width:520px;bottom:auto;top:50%;border-radius:24px;transform:translate(-50%,-46%)} .sheet.show{transform:translate(-50%,-50%)}}
.auth{min-height:100dvh;display:flex;padding:24px;overflow-y:auto;background:radial-gradient(1200px 500px at 50% -10%,#22304a 0%,var(--navy) 55%)}
.auth-card{width:100%;max-width:430px;margin:auto;background:var(--surface);border-radius:24px;padding:26px;box-shadow:var(--sh-3);animation:pop .4s var(--t) both}
.auth .logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:6px} .auth .logo .dot{width:46px;height:46px;border-radius:14px;font-size:22px} .auth .logo b{font-size:30px;font-weight:900;color:var(--navy)}
.role-pick{display:grid;gap:11px;margin-top:16px}
.role-opt{display:flex;align-items:center;gap:14px;padding:15px;border:1.5px solid var(--line);border-radius:16px;text-align:left;transition:border-color var(--t),transform var(--t),background var(--t);width:100%}
.role-opt:hover{border-color:var(--amber);background:#fffaf0} .role-opt:active{transform:scale(.98)}
.role-opt .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:0 0 46px} .role-opt b{display:block;font-size:16px} .role-opt span{font-size:13px;color:var(--txt-2)}
.social{display:grid;gap:10px;margin-top:14px}
.social-btn{height:50px;border:1.5px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:800;font-size:15px;background:#fff;transition:background var(--t),transform var(--t)} .social-btn:active{transform:scale(.98)}
.social-btn.apple{background:#000;color:#fff;border-color:#000} .social-btn:hover{filter:brightness(.97)}
.social-btn svg{width:20px;height:20px}
.sep{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--txt-3);font-size:12px;font-weight:700} .sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}
.tc{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--txt-2);font-weight:600;margin:4px 0 14px;cursor:pointer} .tc input{width:20px;height:20px;flex:0 0 20px;margin-top:1px} .tc a{color:var(--info);font-weight:800}
#conf{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden} .cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
.screen{animation:scin .32s cubic-bezier(.2,.8,.2,1) both} @keyframes scin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stg>*{animation:stg .4s var(--t) both}
.stg>*:nth-child(1){animation-delay:.02s}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.1s}.stg>*:nth-child(4){animation-delay:.14s}.stg>*:nth-child(5){animation-delay:.18s}.stg>*:nth-child(6){animation-delay:.22s}.stg>*:nth-child(7){animation-delay:.26s}.stg>*:nth-child(8){animation-delay:.3s}
@keyframes stg{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(min-width:1024px){.rail{display:flex}.bottomnav{display:none}.fab{bottom:26px}.content{padding:24px 30px 40px}.cols-2{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:repeat(3,1fr)}.doc-grid{grid-template-columns:1.25fr 1fr}}
@media(max-width:1023px){.appbar .ab-brand{display:flex}.appbar .title{display:none}.cols-2,.cols-3,.doc-grid{grid-template-columns:1fr}}
@media(min-width:600px) and (max-width:1023px){.cols-3{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* receta catalog */
.cat-box{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.cat-h{background:var(--surface-2);padding:10px 14px;font-weight:800;font-size:12.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
.serv-row{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.serv-main{flex:1;min-width:55%;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--txt)}
.serv-main input{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
.serv-price{font-weight:800;color:var(--teal);font-size:13px;white-space:nowrap}
.serv-opts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:9px 16px;padding-left:30px;align-items:center}

.opc input{width:16px;height:16px}
.serv-otro{height:32px;width:150px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff}

.total-bar b{font-size:22px}
.deliv{display:flex;gap:10px;flex-wrap:wrap}
.deliv label{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:12px;padding:11px;display:flex;gap:9px;align-items:center;font-size:13px;font-weight:700;cursor:pointer}
.deliv input{width:18px;height:18px}
/* study viewer */
.viewer-canvas{position:relative;background:radial-gradient(circle at 50% 40%,#1a2433,#06080c);border-radius:14px;overflow:hidden;aspect-ratio:2/1}
.viewer-canvas svg{width:100%;height:100%;display:block;transition:filter .15s}
.scanbar{position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(180deg,rgba(95,168,155,.35),transparent);box-shadow:0 0 24px rgba(95,168,155,.6);animation:scan 1.6s ease-in-out 1;pointer-events:none}
@keyframes scan{0%{top:-30%}100%{top:100%}}

.vbar{width:62%;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}

.dlrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}

.portal-head{padding:22px 18px;color:#fff;display:flex;align-items:center;gap:12px}
.portal-head .dot{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-size:20px}
.portal-wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
</style>
</head>
<body>
<h2 class="sr-only">Demo interactiva de aro3d con roles Admin, Doctor y Paciente, calendario, CRUD y sistema de puntos.</h2>
<div id="app"></div>
<div id="snk"></div><div id="conf"></div>
<div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ce=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const initials=n=>(n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const esc=s=>(''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const edad=f=>f?(new Date().getFullYear()-+f.slice(0,4)):'';

function timeUntil(fecha,hora){if(!fecha)return null;const dt=new Date(fecha+'T'+(hora||'09:00'));const ms=dt-new Date();if(ms<0)return{str:'finalizó',past:true,ms};const min=Math.floor(ms/6e4),h=Math.floor(min/60),d=Math.floor(h/24);let str;if(d>0)str='en '+d+' día'+(d>1?'s':'')+(h%24?' '+(h%24)+'h':'');else if(h>0)str='en '+h+'h'+(min%60?' '+(min%60)+'min':'');else str='en '+min+' min';return{str,ms};}
function nextCita(pred){return DB.recetarios.filter(r=>r.fechaCita&&r.estatus==='Con Cita'&&(!pred||pred(r))).map(r=>({r,t:timeUntil(r.fechaCita,r.hora)})).filter(x=>x.t&&!x.t.past).sort((a,b)=>a.t.ms-b.t.ms)[0];}

function ringHTML(p){const t=tierOf(p),nx=nextTier(p);const base=t.min,top=nx?nx.min:t.min+1000;const frac=nx?Math.min(1,(p-base)/(top-base)):1;const r=42,c=2*Math.PI*r,off=c*(1-frac);
 return `<div class="ring-wrap"><svg width="96" height="96" viewBox="0 0 96 96"><circle class="rc" cx="48" cy="48" r="${r}" stroke="rgba(255,255,255,.22)"/><circle class="rc" cx="48" cy="48" r="${r}" stroke="${t.c}" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1s ease .2s" data-off="${off}"/></svg><div class="center" style="color:#fff"><b style="font-size:13px">${t.n}</b><span style="font-size:10px;opacity:.85">${nx?('faltan '+(nx.min-p)):'máx'}</span></div></div>`;}

const SCREENS={
 calendario(){
  const base=new Date(selDay+'T00:00');const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),todayS=new Date().toISOString().slice(0,10);
  const has={};DB.recetarios.forEach(r=>{if(r.fechaCita&&r.estatus!=='Cancelado'){const k=r.fechaCita;has[k]=(has[k]||0)+1;}});
  let cells='';['D','L','M','M','J','V','S'].forEach(d=>cells+=`<div class="dow">${d}</div>`);
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${has[ds]?'has':''} ${ds===todayS?'today':''} ${ds===selDay?'sel':''}" data-day="${ds}">${d}${has[ds]?'<span class="n"></span>':''}</button>`;}
  const dayCitas=DB.recetarios.filter(r=>r.fechaCita===selDay&&r.estatus!=='Cancelado').sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  const nx=nextCita();
  return `<div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px"><h1 class="page-h" style="margin:0">Calendario de Citas</h1>${nx?`<span class="cd">${svg('clock')} Próxima cita ${nx.t.str} · ${esc(pac(nx.r.pacienteId).nombre.split(' ')[0])}</span>`:''}</div>
   <div class="grid doc-grid">
    <div class="card"><div class="between" style="margin-bottom:12px"><b style="text-transform:capitalize">${base.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</b><span class="chip">${svg('cal',13)} ${Object.keys(has).length} días con citas</span></div><div class="cal">${cells}</div><p class="xsmall muted" style="margin:12px 0 0">Toca un día para ver sus citas</p></div>
    <div class="card"><div class="between" style="margin-bottom:6px"><b style="text-transform:capitalize">${fmtFull(selDay)}</b><span class="chip info">${dayCitas.length} cita${dayCitas.length!==1?'s':''}</span></div>
     <div class="stg" style="margin-top:8px">${dayCitas.length?dayCitas.map(r=>{const p=pac(r.pacienteId),d=doc(r.doctorId);return `<button class="list-item" data-cita="${r.id}" style="width:100%;text-align:left">
       <span class="icon-box" style="color:var(--navy);font-weight:900;font-size:13px">${r.hora||'--'}</span>
       <span style="flex:1;min-width:0"><b style="display:block">${esc(p.nombre)}</b><span class="small muted">${esc(d?d.nombre:'')} · ${esc(r.estudios[0])}</span></span>
       <span class="chip ${estaChip[r.estatus]}">${r.estatus}</span></button>`;}).join(''):'<div style="text-align:center;padding:22px 0;color:var(--txt-3)">'+svg('cal')+'<p class="muted small" style="margin-top:6px">Sin citas este día</p></div>'}</div>
     <button class="btn filled block" data-act="addcita" style="margin-top:12px">${svg('plus')} Agregar cita este día</button></div>
   </div>`;
 },
 recetarios(){return recList(DB.recetarios,'Estatus de Citas',true);},
 doctores(){
  const s=[...DB.doctores].sort((a,b)=>b.puntos-a.puntos);
  return `<h1 class="page-h">Doctores</h1><p class="page-sub">Ranking por puntos · administra los doctores (CRUD)</p>

function recList(list,title,allowActions){

   <span class="avatar" style="background:var(--navy)">${initials(p?p.nombre:'?')}</span>

/* ===== visor de estudio (render en tiempo real, simulado) ===== */
function lcg(seed){let s=(seed>>>0)||1;return ()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
function hashId(id){let h=0;const t=''+id;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h;}
function studyArt(seed){
 const rnd=lcg(seed);let teeth='';
 for(let arch=0;arch<2;arch++){const dir=arch?1:-1,cy=150;
   for(let i=0;i<14;i++){const t=i/13,x=70+t*460,yy=cy-dir*Math.sin(t*Math.PI)*42;const w=16+rnd()*9,h=24+rnd()*18,op=(.45+rnd()*.45).toFixed(2),rot=((t-.5)*64*dir).toFixed(1);
     teeth+=`<g transform="translate(${x.toFixed(1)} ${yy.toFixed(1)}) rotate(${rot})"><rect x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="url(#tg)" opacity="${op}"/></g>`;}}
 let noise='';for(let i=0;i<46;i++)noise+=`<circle cx="${(rnd()*600).toFixed(0)}" cy="${(rnd()*300).toFixed(0)}" r="${(rnd()*1.7).toFixed(1)}" fill="#bfe" opacity="${(rnd()*.09).toFixed(2)}"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300"><defs><radialGradient id="bg" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#26384e"/><stop offset="1" stop-color="#06080c"/></radialGradient><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4f7"/><stop offset="1" stop-color="#7f93a3"/></linearGradient></defs><rect width="600" height="300" fill="url(#bg)"/><path d="M70 150 Q300 36 530 150" stroke="#9fb4c4" stroke-width="2" fill="none" opacity=".22"/><path d="M70 150 Q300 264 530 150" stroke="#9fb4c4" stroke-width="2" fill="none" opacity=".22"/>${teeth}${noise}<text x="14" y="22" fill="#7fe6c8" font-family="monospace" font-size="11" opacity=".7">ARO · 3D · ${(70+seed%30)}kV</text></svg>`;
}

/* ===== descargas ===== */
function triggerDL(blob,fn){const u=URL.createObjectURL(blob);const a=ce('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function deburr(s){return (''+s).normalize('NFD').replace(/[̀-ͯ]/g,'');}
function buildPDF(title,lines){const ep=s=>deburr(s).replace(/([()\\])/g,'\\$1');let c='BT /F1 18 Tf 60 790 Td ('+ep(title)+') Tj /F1 11 Tf';lines.forEach(l=>{c+=' 0 -20 Td ('+ep(l)+') Tj';});c+=' ET';
 const objs=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R>>>>/Contents 5 0 R>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>','<</Length '+c.length+'>>\nstream\n'+c+'\nendstream'];
 let pdf='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});const xs=pdf.length;
 pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';off.forEach(o=>{pdf+=(''+o).padStart(10,'0')+' 00000 n \n';});
 pdf+='trailer\n<</Size '+(objs.length+1)+'/Root 1 0 R>>\nstartxref\n'+xs+'\n%%EOF';return pdf;}
function svgToJPG(svgStr,cb){const img=new Image();const u=URL.createObjectURL(new Blob([svgStr],{type:'image/svg+xml'}));img.onload=()=>{const cv=document.createElement('canvas');cv.width=1200;cv.height=600;const x=cv.getContext('2d');x.fillStyle='#06080c';x.fillRect(0,0,1200,600);x.drawImage(img,0,0,1200,600);URL.revokeObjectURL(u);cv.toBlob(cb,'image/jpeg',.92);};img.onerror=()=>cb(null);img.src=u;}
function dl(fmt,rid){const r=DB.recetarios.find(x=>x.id===rid);if(!r)return;const p=pac(r.pacienteId);const base='ARO_'+deburr((p?p.nombre:'estudio')).replace(/\s+/g,'_')+'_'+r.id;const art=studyArt(hashId(r.id));
 if(fmt==='jpg'){svgToJPG(art,b=>{if(b)triggerDL(b,base+'.jpg');snack('Estudio descargado (JPG)','download');});}
 else if(fmt==='dcm'){const meta='DICM\n# ARO Demo DICOM\nPatientName: '+deburr(p?p.nombre:'')+'\nStudy: '+deburr(r.estudios.join(', '))+'\nDate: '+(r.fechaCita||r.fechaAlta)+'\nModality: CBCT\nInstitution: ARO 3D\n(archivo de demostración)';triggerDL(new Blob([meta],{type:'application/dicom'}),base+'.dcm');snack('Estudio descargado (DICOM)','download');}
 else{const pdf=buildPDF('ARO - Informe de Estudio',['Paciente: '+(p?p.nombre:''),'Estudio: '+r.estudios.join(', '),'Doctor: '+(doc(r.doctorId)?doc(r.doctorId).nombre:''),'Clinica: '+(r.clinica||'-'),'Fecha: '+(r.fechaCita||r.fechaAlta),'Monto: '+money(r.monto),'','Hallazgos: estudio dentro de parametros normales (demo).','','aro3d.com - Apoyo Radiologico Oral 3D']);triggerDL(new Blob([pdf],{type:'application/pdf'}),base+'.pdf');snack('Informe descargado (PDF)','download');}}

 openSheet(`<h3>¡Estudio completado!</h3>
  <div class="card" style="border-color:var(--ok)"><div class="row"><span class="icon-box" style="color:var(--ok)">${svg('check',20)}</span><div style="flex:1"><b>${esc(r.estudios.join(', '))}</b><div class="small muted">${esc(p?p.nombre:'')}</div></div></div></div>
  <div class="card" style="background:var(--surface-2);border:none;margin-top:12px"><div class="row">${svg('mail',18)}<span class="small" style="font-weight:700">Enlace al estudio enviado por correo</span></div><p class="xsmall muted" style="margin:8px 0 0;word-break:break-all">${esc(portalLink(r.id))}</p></div>
  <div class="dlrow"><button class="btn filled" data-view="${r.id}">${svg('eye',16)} Ver estudio</button><button class="btn navy" data-portal="${r.id}">${svg('ext',16)} Abrir portal</button></div>
  <button class="btn tonal block" style="margin-top:10px" onclick="closeSheet()">Cerrar</button>`);}

/* ===== confirmación de receta + agendar ===== */
function recetaConfirm(r){openSheet(`<div style="text-align:center"><span class="icon-box" style="width:64px;height:64px;border-radius:18px;margin:0 auto;color:var(--ok)">${svg('check',30)}</span>
  <h3 style="margin:12px 0 4px">¡Listo, tu receta ha sido enviada!</h3>
  <p class="small muted" style="margin:0">Se envió por ${esc(r.entrega||'correo')} al paciente. Si deseas, agenda la cita.</p></div>
  <button class="btn filled block" style="margin-top:16px" data-act="agendarReceta" data-rid="${r.id}">${svg('cal')} Agendar Cita</button>
  <div class="row" style="gap:10px;margin-top:10px"><button class="btn tonal" style="flex:1" onclick="snack('Un especialista te contactará (demo)','mail')">Que me contacten</button><button class="btn tonal" style="flex:1" onclick="closeSheet()">Cerrar</button></div>`);}
function scheduleSheet(rid){openSheet(`<h3>Agendar Cita</h3><p class="small muted" style="margin-top:-8px">Selecciona la fecha y hora de tu cita</p>
  <div class="row" style="gap:10px"><div class="field" style="flex:1"><label>Fecha <span class="req">*</span></label><input type="date" id="sc_f" value="${new Date(Date.now()+864e5).toISOString().slice(0,10)}"></div><div class="field" style="flex:1"><label>Hora <span class="req">*</span></label><select id="sc_h">${HORAS.map(h=>`<option>${h}</option>`).join('')}</select></div></div>
  <button class="btn filled block" data-act="confirmSchedule" data-rid="${rid}">${svg('check')} Confirmar cita</button>`);}

function wireDL(root){
 root.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>dl(b.dataset.dl,b.dataset.rid));
 root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>studyViewer(b.dataset.view));
 root.querySelectorAll('[data-vpac]').forEach(b=>b.onclick=()=>verPac(b.dataset.vpac));
 root.querySelectorAll('[data-portal]').forEach(b=>b.onclick=()=>openPortal(b.dataset.portal));
 root.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{location.hash='';});
}
function bindSheet(){
 const s=$('#sheet');
 s.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelSheet(b.dataset.cancel));
 s.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>calSim(b.dataset.rid,b.dataset.cal));
 s.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b));
 s.querySelectorAll('[data-cita]').forEach(b=>b.onclick=()=>citaSheet(b.dataset.cita));
 wireDL(s);
}
function bind(){
 document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>enterRole(b.dataset.enter));
 document.querySelectorAll('[data-social]').forEach(b=>b.onclick=()=>{snack('Iniciando con '+(b.dataset.social==='apple'?'Apple':'Google')+'… (demo)',b.dataset.social==='apple'?'apple':'mail');setTimeout(()=>enterRole('paciente'),700);});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.nav;render();window.scrollTo(0,0);});
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;render();});
 document.querySelectorAll('[data-cita]').forEach(b=>b.onclick=()=>citaSheet(b.dataset.cita));
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b));
 wireDL(document);
}
function act(a,el){
 if(a==='logout'){state.role=null;state.screen=null;render();return;}
 if(a==='reset')return resetDemo();
 if(a==='registro')return registroSheet();
 if(a==='copycode'){if(navigator.clipboard)navigator.clipboard.writeText(el.dataset.code);snack('Código copiado: '+el.dataset.code,'copy');return;}
 if(a==='afiliar'){if(!$('#aff_tc').checked){snack('Acepta los términos y condiciones','close');return;}const d=affiliateByCode('p4',$('#aff_code').value);if(d){confetti();snack('¡Afiliado a '+d.nombre+'! +50 puntos','spark');render();}return;}
 if(a==='canjear')return redeem('p4');
 if(a==='complete')return completeCita(el.dataset.rid);
 if(a==='enviarReceta'){const checks=[...document.querySelectorAll('.rd_serv:checked')];if(!checks.length){snack('Selecciona al menos un estudio','file');return;}
   const est=checks.map(c=>{const id=c.dataset.id;const ops=[...document.querySelectorAll('.rd_opc[data-for="'+id+'"]:checked')].map(o=>o.parentElement.textContent.trim());const ot=(document.querySelector('.serv-otro[data-for="'+id+'"]')||{}).value;let n=c.value;if(ops.length)n+=' ('+ops.join(', ')+')';if(ot)n+=' ['+ot+']';return n;});
   const total=window.recetaTotal();const ent=(document.querySelector('input[name=rd_ent]:checked')||{}).value;
   const r=createCita({pacienteId:$('#rd_pac').value,doctorId:'d1',estudios:est,monto:total,obs:$('#rd_obs').value});r.entrega=ent;save();recetaConfirm(r);return;}
 if(a==='agendarReceta')return scheduleSheet(el.dataset.rid);
 if(a==='confirmSchedule'){const r=DB.recetarios.find(x=>x.id===el.dataset.rid);if(!r)return;const f=$('#sc_f').value;if(!f){snack('Elige fecha','cal');return;}r.fechaCita=f;r.hora=$('#sc_h').value;r.estatus='Con Cita';save();render();emailSim(r);return;}
 if(a==='agendar'){const f=$('#ag_fecha').value;if(!f){snack('Elige una fecha','cal');return;}const r=createCita({pacienteId:'p4',doctorId:pac('p4').doctorId||'d1',estudios:[$('#ag_est').value],fechaCita:f,hora:$('#ag_hora').value,monto:850});render();emailSim(r);return;}
 if(a==='addcita')return addCitaSheet();
 if(a==='saveCita'){const f=$('#ac_fecha').value;if(!f){snack('Elige fecha','cal');return;}const r=createCita({pacienteId:$('#ac_pac').value,doctorId:$('#ac_doc').value,estudios:[$('#ac_est').value],fechaCita:f,hora:$('#ac_hora').value,monto:$('#ac_monto').value,obs:$('#ac_obs').value});selDay=f;render();emailSim(r);return;}
 if(a==='addpac')return pacFormSheet();
 if(a==='editpac')return pacFormSheet(el.dataset.id);
 if(a==='delpac'){const p=pac(el.dataset.id);return confirmDel('pac',p.id,p.nombre);}
 if(a==='savePac'){const n=$('#pf_n').value.trim();if(!n){snack('Escribe el nombre','user');return;}const id=el.dataset.id;
   if(id){const p=pac(id);p.nombre=n;p.email=$('#pf_e').value;p.tel=$('#pf_t').value;p.fechaNac=$('#pf_f').value;save();snack('Paciente actualizado','check');}
   else{const docSel=$('#pf_doc')?$('#pf_doc').value:'';if(docSel&&!$('#pf_tc').checked){snack('Acepta los términos y condiciones','close');return;}const p=addPaciente({nombre:n,email:$('#pf_e').value,tel:$('#pf_t').value,fechaNac:$('#pf_f').value});if(docSel){assignToDoctor(p.id,docSel);confetti();snack('Paciente dado de alta y afiliado','spark');}else snack('Paciente dado de alta','check');}
   closeSheet();render();return;}
 if(a==='adddoc')return docFormSheet();
 if(a==='editdoc')return docFormSheet(el.dataset.id);
 if(a==='deldoc'){const d=doc(el.dataset.id);return confirmDel('doc',d.id,d.nombre);}
 if(a==='saveDoc'){const n=$('#df_n').value.trim(),e=$('#df_e').value.trim();if(!n||!e){snack('Nombre y correo obligatorios','user');return;}const id=el.dataset.id;
   if(id){const d=doc(id);d.nombre=n;d.email=e;d.tel=$('#df_t').value;d.area=$('#df_a').value;d.clinica=$('#df_c').value;save();snack('Doctor actualizado','check');}
   else{const d=addDoctor({nombre:n,email:e,tel:$('#df_t').value,area:$('#df_a').value,clinica:$('#df_c').value});snack('Doctor dado de alta · '+d.codigo,'award');}
   closeSheet();render();return;}
 if(a==='doDel'){if(el.dataset.kind==='pac')delPaciente(el.dataset.id);else delDoctor(el.dataset.id);closeSheet();snack('Eliminado','trash');render();return;}
 if(a==='verarch'){snack('Abriendo visor de estudio… (demo)','eye');return;}
 if(a==='toast'){snack(el.dataset.msg||'Listo','check');return;}
}
window.completeCita=completeCita;window.cancelCita=cancelCita;window.closeSheet=closeSheet;window.snack=snack;
window.addEventListener('hashchange',function(){closeSheet();render();});
render();
</script>
</body>
</html>
